name: DistroPrep CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        run: node --test tests/*.test.mjs
      - name: Parse application JavaScript
        run: |
          node --check app.js
          node --check bulk1000.mjs
          node --check bulk-enhancements.mjs
          node --check handoff.mjs
          node --check smart-match.mjs
          node --check release-template.mjs
      - name: Verify required files
        run: test -f index.html && test -f bulk1000.html && test -f bulk1000.css && test -f validator.mjs && test -f handoff.mjs && test -f README.md
